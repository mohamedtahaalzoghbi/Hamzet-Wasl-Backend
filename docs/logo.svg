<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Hamzet Wasl logo">
  <defs>
    <linearGradient id="hwGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#12A4A4"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="224" height="224" rx="48" fill="url(#hwGradient)"/>

  <!-- the connecting arc: two sides of the community linked -->
  <path d="M64 156 C 92 96, 148 96, 176 156" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <circle cx="64" cy="158" r="15" fill="#FFFFFF"/>
  <circle cx="176" cy="158" r="15" fill="#FFFFFF"/>

  <!-- the "HW" monogram -->
  <text x="120" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="2">HW</text>
</svg>
